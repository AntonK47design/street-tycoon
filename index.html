<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3dcc0" />
    <title>Street Tycoon</title>
    %PLATFORM_SDK%
    <script>
      window.__stBootT0 = performance.now();
    </script>
    <style>
      html,body{margin:0;height:100%;background:linear-gradient(#9cc3df,#f3dcc0 70%);overflow:hidden}
      #boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;animation:stshow .2s .8s forwards}
      #boot .bar{width:min(60vw,300px);height:12px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;border:3px solid #fff8ea;box-shadow:0 4px 0 rgba(60,40,20,.18)}
      #boot .bar i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(#f6cf63,#e0a83a);animation:stload 1.1s ease-in-out infinite}
      @keyframes stshow{to{opacity:1}}
      @keyframes stload{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
